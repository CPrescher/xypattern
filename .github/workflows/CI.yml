# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        include:
          - os: macos-latest
            python-version: "3.15"
          - os: windows-latest
            python-version: "3.15"

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install poetry
      run: pipx install poetry==2.2.1

    - name: Keep virtualenv compatible with Python 3.8
      if: matrix.python-version == '3.8'
      run: pipx inject poetry "virtualenv<21.5"

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        allow-prereleases: true
        cache: 'poetry'

    - name: Install dependencies
      run: |
        poetry env use python
        poetry install

    - name: Test with pytest
      run: poetry run pytest --cov=xypattern --cov-report=xml

    - name: Build and test installed distribution
      if: matrix.python-version == '3.14' || matrix.python-version == '3.15'
      shell: bash
      run: |
        python -m pip install build
        python -m build
        python -m venv "$RUNNER_TEMP/wheel-test"
        if [ "$RUNNER_OS" = "Windows" ]; then
          wheel_python="$RUNNER_TEMP/wheel-test/Scripts/python.exe"
        else
          wheel_python="$RUNNER_TEMP/wheel-test/bin/python"
        fi
        "$wheel_python" -m pip install dist/*.whl pytest
        cd "$RUNNER_TEMP"
        "$wheel_python" -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v3
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
