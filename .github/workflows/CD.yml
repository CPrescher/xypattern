# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CD

on:
  release:
    types: [published]

jobs:
  build_package:
    strategy:
      fail-fast: false
      matrix:
        os: [ "ubuntu-latest", "macos-latest", "windows-latest" ]
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15" ]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Poetry
        run: |
          pipx install poetry==2.2.1
          pipx inject poetry "poetry-dynamic-versioning[plugin]"

      - name: Keep virtualenv compatible with Python 3.8
        if: matrix.python-version == '3.8'
        run: pipx inject --force poetry "virtualenv<21.5"

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: 'poetry'

      - name: Build Package
        run: |
          poetry env use python
          poetry build

      - name: Test installed wheel
        shell: bash
        run: |
          python -m pip install dist/*.whl pytest
          cd "$RUNNER_TEMP"
          python -m pytest "$GITHUB_WORKSPACE/tests" --import-mode=importlib

      - name: Upload wheels to artifact
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}-py${{ matrix.python-version }}
          path: dist/*

  pypi-publish:
    name: Upload release to PyPI
    needs: build_package
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/xypattern/
    permissions:
      id-token: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true

      - name: Check the dist folder
        run: ls -la dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
